<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fellestall.no – en oversikt over norske statsfinanser</title>
  <meta name="description" content="Statsbudsjettet og statsregnskapet, normalisert og forklart: kroner per innbygger, andeler og utvikling over tid – helt ned til den enkelte posten." />

  <!--
    Kanonisk adresse. Nettstedet ligger også på github.io-adressen mens det
    bygges; uten denne kan søkemotorer indeksere begge og dele opp treffene.
  -->
  <link rel="canonical" href="https://fellestall.no/" />

  <!--
    Ikoner. SVG-en er hovedformen; PNG-ene er for flater som ikke tar SVG.
    Adressene er relative fordi vite bygger med base './': nettstedet skal
    kunne ligge både på roten av fellestall.no og under en prosjektsti på
    github.io mens det testes.
  -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#14161A" />

  <!-- Delingskort. og:image må være en absolutt adresse; relative virker ikke. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Fellestall.no" />
  <meta property="og:locale" content="nb_NO" />
  <meta property="og:url" content="https://fellestall.no/" />
  <meta property="og:title" content="Hvor blir det av skattepengene?" />
  <meta property="og:description" content="Statsbudsjettet og statsregnskapet, normalisert og forklart – kroner per innbygger, andeler av BNP og utvikling over tid, helt ned til den enkelte posten." />
  <meta property="og:image" content="https://fellestall.no/delingsbilde.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Fellestall.no – budsjettkart der de største utgiftsområdene er tegnet som fliser etter størrelse." />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Libre+Franklin:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="max-width:60ch;margin:64px auto;padding:0 24px;font-family:system-ui,sans-serif;line-height:1.6;color:#3B3A36">
      <h1 style="font-family:Georgia,serif;font-size:28px;color:#14161A">Fellestall.no</h1>
      <p>
        Denne siden viser statsbudsjettet og statsregnskapet som interaktive kart og grafer, og
        krever JavaScript for å regne om tallene mens du utforsker dem.
      </p>
      <p>
        Tallene er offentlige og finnes i sin helhet hos kilden:
        <a href="https://statsregnskapet.dfo.no" style="color:#C5452E">DFØ Statsregnskapet</a>
        for regnskap og bevilgninger, og
        <a href="https://www.ssb.no" style="color:#C5452E">SSB</a>
        for folketall, konsumprisindeks og nasjonalregnskap.
      </p>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

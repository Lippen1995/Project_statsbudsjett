name: Vercel – HTTPS og domene før DNS-overgang

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gh-pages
          path: published-site
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Kontroller Vercel direkte med produksjonsnavn og vanlig TLS-validering
        run: node scripts/deploy/domain-preflight.mjs published-site 216.150.1.1,216.150.16.1

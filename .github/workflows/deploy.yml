name: Deploy til GitHub Pages

on:
  workflow_dispatch:
    inputs:
      data_source:
        description: Datakilde for bygg (repository brukes ved tilbakeføring)
        type: choice
        options: [neon, repository, snapshot]
        default: neon
      data_snapshot:
        description: Verifisert dataversjon ved eksplisitt tilbakeføring
        type: string
        default: ''
      expected_snapshot:
        description: Forventet gjeldende dataversjon ved tilbakeføring
        type: string
        default: ''
      verify_only:
        description: Bygg og kontroller uten å publisere, aktivere data eller sende varsler
        type: boolean
        default: false
  workflow_call:        # kjedes fra ETL-workflowen
    inputs:
      data_source:
        type: string
        default: neon
      verify_only:
        type: boolean
        default: false
  push:
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/neon/**'
      - 'server/admin/**'
      - 'scripts/admin/**'
      - 'scripts/deploy/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Gruppen må inneholde referansen. Med én felles gruppe for alle brancher
  # havner også kjøringer fra feature-brancher i den, og selv om de bare hopper
  # over jobben, avbryter de en utrulling fra main som er i gang. Det skjedde:
  # en push til en feature-branch rett etter en push til main avbrøt
  # main-utrullingen, og livesiden ble stående på forrige bygg.
  # Tørrkjøringer må heller ikke avbryte en faktisk publisering.
  group: pages-deploy-${{ github.ref }}-${{ inputs.verify_only == true && 'verify' || 'publish' }}
  cancel-in-progress: true

jobs:
  build-deploy:
    # Bare main publiseres. Uten denne sperren force-pusher enhver push til
    # web/** – også fra en feature-branch – den branchens bygg til gh-pages,
    # og livesiden viser noe som aldri er slått sammen.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vercel-migration
    concurrency:
      group: neon-data-production
      cancel-in-progress: false
    env:
      DATA_SOURCE: ${{ inputs.data_source || 'neon' }}
      DATA_SNAPSHOT: ${{ inputs.data_snapshot || '' }}
      EXPECTED_SNAPSHOT: ${{ inputs.expected_snapshot || '' }}
    steps:
      - name: Sjekk ut siste versjon av branchen (inkl. ev. ETL-datacommit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Kontroller valg av datakilde
        run: |
          case "$DATA_SOURCE" in neon|repository|snapshot) ;; *) echo 'Ugyldig datakilde'; exit 1 ;; esac

      - name: Installer Neon-verktøy for datagrunnlaget
        run: |
          npm ci --omit=dev
          npm install --global neon@8.4.5

      - name: Hent production-forbindelsen til Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          test -n "$NEON_API_KEY" || { echo 'NEON_API_KEY mangler i vercel-migration'; exit 1; }
          if ! neon env pull --project-id bitter-firefly-21339346 --branch production --service postgres --file .env.local > "$RUNNER_TEMP/neon-publish.log" 2>&1; then
            echo 'Neon-forbindelsen kunne ikke hentes. Siste publiserte nettsted beholdes.'
            exit 1
          fi
          chmod 600 .env.local

      - name: Kontroller administratorens publiseringssperre og tilbakeføringsversjon
        run: node --use-env-proxy --env-file=.env.local scripts/admin/data-gate.mjs

      - name: Eksporter eksplisitt valgt og verifisert dataversjon
        if: env.DATA_SOURCE == 'snapshot'
        run: |
          node --use-env-proxy --env-file=.env.local scripts/neon/data-cli.mjs export --snapshot "$DATA_SNAPSHOT" --output "$RUNNER_TEMP/neon-publish-data" --report "$RUNNER_TEMP/neon-publish-report.json"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs'
          const path=process.env.RUNNER_TEMP+'/neon-publish-report.json'
          const report=JSON.parse(readFileSync(path))
          if(report.snapshot!==process.env.DATA_SNAPSHOT)throw Error('Feil dataversjon')
          report.previous=process.env.EXPECTED_SNAPSHOT
          writeFileSync(path,JSON.stringify(report)+'\n')
          JS
          mv web/public/data "$RUNNER_TEMP/repository-data"
          cp -a "$RUNNER_TEMP/neon-publish-data" web/public/data

      - name: Importer ETL-grunnlaget til Neon og kontroller full eksport før bygg
        if: env.DATA_SOURCE == 'neon'
        run: |
          source_commit="$(git rev-parse HEAD)"
          npm run data:roundtrip -- --source web/public/data --output "$RUNNER_TEMP/neon-publish-data" --source-commit "$source_commit" --report "$RUNNER_TEMP/neon-publish-report.json"
          # Bygget skal bare lese eksporten som nettopp er verifisert fra Neon.
          mv web/public/data "$RUNNER_TEMP/repository-data"
          cp -a "$RUNNER_TEMP/neon-publish-data" web/public/data

      - name: Hent validerte utkast for forhåndsvisning
        run: node scripts/analyser/previews.mjs collect
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_REVIEW_PREVIEWS_FILE: ${{ runner.temp }}/analysis-previews.json

      - name: Behold eldre ressurser for åpne faner og DNS-overgangen
        run: |
          git fetch --no-tags origin gh-pages
          mkdir -p "$RUNNER_TEMP/previous-site"
          git archive FETCH_HEAD assets | tar -x -C "$RUNNER_TEMP/previous-site"

      - name: Installer og bygg
        working-directory: web
        env:
          ANALYSIS_REVIEW_PREVIEWS_FILE: ${{ runner.temp }}/analysis-previews.json
        run: |
          npm ci
          if [ ! -f public/data/meta.json ]; then
            echo "::warning::web/public/data/ mangler – kjør ETL-workflowen først."
          fi
          npm run build
          cp -an "$RUNNER_TEMP/previous-site/assets/." dist/assets/

      - name: Registrer godkjent dataversjon etter bestått bygg
        if: env.DATA_SOURCE != 'repository' && inputs.verify_only != true
        run: |
          node --use-env-proxy --env-file=.env.local scripts/admin/data-gate.mjs
          node --use-env-proxy --env-file=.env.local scripts/neon/data-cli.mjs activate --report "$RUNNER_TEMP/neon-publish-report.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/neon-publish-report.json`))
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Verifisert Neon-dataversjon: ${report.snapshot}\n\n${report.files} filer / ${report.bytes} byte. Bygget bruker eksporten fra Neon.\n`)
          JS

      - name: Publiser til gh-pages-branchen
        if: inputs.verify_only != true
        working-directory: web/dist
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Legg forhåndsvisningslenker i gjennomgangene
        if: inputs.verify_only != true
        run: node scripts/analyser/previews.mjs notify
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_REVIEW_PREVIEWS_FILE: ${{ runner.temp }}/analysis-previews.json

      - name: Slett lokale databasehemmeligheter
        if: always()
        run: rm -f .env.local .neon "$RUNNER_TEMP/neon-publish.log"

  vercel-mirror:
    needs: build-deploy
    if: github.ref_name == 'main' && vars.VERCEL_MIRROR_ENABLED == 'true' && inputs.verify_only != true
    uses: ./.github/workflows/vercel-mirror.yml
    secrets: inherit
    permissions:
      contents: read

  distribute-analyses:
    needs: build-deploy
    if: github.ref_name == 'main' && vars.ANALYSIS_AUTOMATION_ENABLED == 'true' && vars.LINKEDIN_ENABLED == 'true' && inputs.verify_only != true
    uses: ./.github/workflows/analysis-distribute.yml
    secrets: inherit
    permissions:
      contents: write

name: Deploy til GitHub Pages

on:
  workflow_dispatch:
  workflow_call:        # kjedes fra ETL-workflowen
  push:
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

concurrency:
  # Gruppen må inneholde referansen. Med én felles gruppe for alle brancher
  # havner også kjøringer fra feature-brancher i den, og selv om de bare hopper
  # over jobben, avbryter de en utrulling fra main som er i gang. Det skjedde:
  # en push til en feature-branch rett etter en push til main avbrøt
  # main-utrullingen, og livesiden ble stående på forrige bygg.
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    # Bare main publiseres. Uten denne sperren force-pusher enhver push til
    # web/** – også fra en feature-branch – den branchens bygg til gh-pages,
    # og livesiden viser noe som aldri er slått sammen.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut siste versjon av branchen (inkl. ev. ETL-datacommit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Installer og bygg
        working-directory: web
        run: |
          npm ci
          if [ ! -f public/data/meta.json ]; then
            echo "::warning::web/public/data/ mangler – kjør ETL-workflowen først."
          fi
          npm run build

      - name: Publiser til gh-pages-branchen
        working-directory: web/dist
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Budsjett – kontroller beredskap med ekte kilder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'etl/budget_proposals.py'
      - 'etl/budget_readiness.py'
      - '.github/workflows/budget-readiness.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: budget-readiness
  cancel-in-progress: false
jobs:
  check:
    runs-on: [self-hosted, linux, x64, budget-native-readiness]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: /workspace/venvs/statsbudsjett/bin/python -m pip install -r etl/requirements.txt
      - name: Test kildediscovery, ekte Excel og import i midlertidig katalog
        run: /workspace/venvs/statsbudsjett/bin/python etl/budget_readiness.py --output editorial/research/budsjett-2027/readiness.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Behold faktisk kontrollresultat også ved feil
        if: always()
        run: |
          test -f editorial/research/budsjett-2027/readiness.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add editorial/research/budsjett-2027/readiness.json
          /workspace/venvs/statsbudsjett/bin/python scripts/commit-generated.py --allowed-root editorial/research/budsjett-2027/readiness.json --message "budget: registrer faktisk kontroll av importberedskap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-readiness
          path: editorial/research/budsjett-2027/readiness.json

name: Budsjett – kontroller beredskap med ekte kilder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'etl/budget_proposals.py'
      - 'etl/budget_readiness.py'
      - '.github/workflows/budget-readiness.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: budget-readiness
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r etl/requirements.txt
      - name: Diagnose normal browser source access
        run: |
          pip install playwright
          python - <<'BROWSER'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path='/usr/bin/google-chrome', args=['--no-sandbox'])
              page = browser.new_page()
              response = page.goto('https://www.regjeringen.no/no/statsbudsjett/2027/id3172975/', wait_until='domcontentloaded', timeout=30000)
              print('Browser HTTP:', response.status)
              print('Browser title:', page.title())
              print('Browser text:', page.locator('body').inner_text()[:350])
              browser.close()
          BROWSER
      - name: Test kildediscovery, ekte Excel og import i midlertidig katalog
        run: python etl/budget_readiness.py --output editorial/research/budsjett-2027/readiness.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Behold faktisk kontrollresultat også ved feil
        if: always()
        run: |
          test -f editorial/research/budsjett-2027/readiness.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add editorial/research/budsjett-2027/readiness.json
          python scripts/commit-generated.py --allowed-root editorial/research/budsjett-2027/readiness.json --message "budget: registrer faktisk kontroll av importberedskap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-readiness
          path: editorial/research/budsjett-2027/readiness.json

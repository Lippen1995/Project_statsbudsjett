name: Budsjett – kontroller beredskap med ekte kilder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'etl/budget_proposals.py'
      - 'etl/budget_readiness.py'
      - '.github/workflows/budget-readiness.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: budget-readiness
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r etl/requirements.txt
      - name: Test kildediscovery, ekte Excel og import i midlertidig katalog
        run: python etl/budget_readiness.py --output editorial/research/budsjett-2027/readiness.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Behold faktisk kontrollresultat også ved feil
        if: always()
        run: |
          test -f editorial/research/budsjett-2027/readiness.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add editorial/research/budsjett-2027/readiness.json
          git diff --cached --quiet && exit 0
          git commit -m 'budget: registrer faktisk kontroll av importberedskap'
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-readiness
          path: editorial/research/budsjett-2027/readiness.json

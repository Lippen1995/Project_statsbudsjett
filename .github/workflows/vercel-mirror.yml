name: Vercel – parallell publisering

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: vercel-static-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref_name == 'main' && (github.event_name == 'workflow_dispatch' || vars.VERCEL_MIRROR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vercel-migration
    env:
      VERCEL_ORG_ID: team_zBf9uUPGwDQKfB9fElKD876W
      VERCEL_PROJECT_ID: prj_UCZp0PnkkoWMO6EJsLHW3y787ALp
    steps:
      - name: Hent publiseringsverktøy fra workflowens commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Hent samme ferdigbygde nettsted som GitHub Pages
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gh-pages
          path: published-site
          persist-credentials: false

      - name: Sett opp Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Installer fast Vercel CLI-versjon
        run: npm install --global vercel@63.1.2

      - name: Pakk statiske filer uten nytt frontendbygg
        run: |
          node scripts/deploy/vercel-static.mjs pack published-site
          mkdir -p .vercel
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(".vercel/project.json", JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))'
          git -C published-site log -1 --format='%H %s'

      - name: Utrull uten å flytte domener
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN mangler i vercel-migration-miljøet'; exit 1; }
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --yes)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e 'const u=new URL(process.env.DEPLOYMENT_URL); if(u.protocol!=="https:" || !u.hostname.endsWith(".vercel.app") || u.origin!==process.env.DEPLOYMENT_URL) process.exit(1)'
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Kontroller innhold og 404 på utrullingen
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/deploy/vercel-static.mjs verify published-site "$DEPLOYMENT_URL"

      - name: Lagre kontrollert adresse
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf 'Kontrollert parallell utrulling: %s\n\nIngen domener er flyttet.\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"


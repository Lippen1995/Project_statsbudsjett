name: Analyser – lever fra planlagt oppgave
on:
  push:
    branches: ["analysis/input-*"]
    paths: ["editorial/handoff/ukens-analyse.json"]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [weekly, feedback, replacement]
        default: weekly
        required: true
      source_commit:
        description: Full commit-SHA med ferdig JSON-utkast
        required: true
      source_path:
        description: JSON-fil under editorial/drafts eller editorial/handoff
        required: true
      pr_number:
        description: Gjennomgangsnummer ved revisjon
        required: false
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: analysis-weekly
  cancel-in-progress: false
jobs:
  deliver:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'analysis/input-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Source inputs are JSON only. Execute scripts exclusively from trusted main.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lever ferdig tekst med boten og be om menneskelig gjennomgang
        run: node scripts/analyser/handoff.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_REVIEWER: ${{ vars.ANALYSIS_REVIEWER }}
          ANALYSIS_MODE: ${{ github.event_name == 'push' && 'weekly' || inputs.mode }}
          ANALYSIS_SOURCE_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.source_commit }}
          ANALYSIS_SOURCE_PATH: ${{ github.event_name == 'push' && 'editorial/handoff/ukens-analyse.json' || inputs.source_path }}
          ANALYSIS_PR_NUMBER: ${{ inputs.pr_number }}

  preview:
    needs: deliver
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Bygg forhåndsvisning fra betrodd main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" --raw-field ref=main

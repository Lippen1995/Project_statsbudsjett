name: Analyser – kontroller oppsett
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analysis-setup.yml'
      - 'editorial/analysis-settings.json'
      - 'scripts/analyser/config.mjs'
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kontroller planlagt leveringsoppsett uten AI-API
        run: node scripts/analyser/config.mjs
        env:
          ANALYSIS_REVIEWER: ${{ vars.ANALYSIS_REVIEWER }}

name: Analyser – tilbakemelding og godkjenning
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: analysis-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.actor != 'github-actions[bot]' &&
      ((github.event.issue.pull_request && startsWith(github.event.issue.title, 'Analyse til gjennomgang:')) || startsWith(github.event.pull_request.head.ref, 'analysis/weekly-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ANALYSIS_REVIEWER: ${{ vars.ANALYSIS_REVIEWER }}
    steps:
      # Execute trusted main scripts, never code from a commented-on PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Les aktiv godkjenner og kontroller leveringsoppsettet
        run: node scripts/analyser/config.mjs
      - name: Registrer endringsønske for den planlagte AI-oppgaven
        if: github.event_name == 'issue_comment' || github.event.review.state != 'approved'
        run: node scripts/analyser/cli.mjs feedback-notice
      - name: Klargjør nøyaktig godkjent versjon
        if: github.event.review.state == 'approved'
        run: node scripts/analyser/cli.mjs stage
      - name: Installer for validering
        if: github.event.review.state == 'approved'
        working-directory: web
        run: npm ci
      - name: Test og bygg før publisering
        if: github.event.review.state == 'approved'
        working-directory: web
        run: |
          npm test
          npm run build
      - name: Kontroller godkjenningen igjen og flett
        if: github.event.review.state == 'approved'
        run: node scripts/analyser/cli.mjs publish
  deploy:
    needs: review
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Review events use a pull-request ref. Dispatch on main explicitly so
      # the deployment's main-only guard stays intact. workflow_dispatch can
      # start a new workflow even when publication uses GITHUB_TOKEN.
      - name: Start utrulling fra main etter godkjent publisering
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" --raw-field ref=main

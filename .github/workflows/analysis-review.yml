name: Analyser – tilbakemelding og godkjenning
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: analysis-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      vars.ANALYSIS_AUTOMATION_ENABLED == 'true' &&
      github.actor != 'github-actions[bot]' &&
      ((github.event.issue.pull_request && startsWith(github.event.issue.title, 'Analyse til gjennomgang:')) || startsWith(github.event.pull_request.head.ref, 'analysis/weekly-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ANALYSIS_REVIEWER: ${{ vars.ANALYSIS_REVIEWER }}
    steps:
      # Execute trusted main scripts, never code from a commented-on PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Revider ved endringsønske
        if: github.event_name == 'issue_comment' || github.event.review.state != 'approved'
        run: node scripts/analyser/cli.mjs feedback
        env:
          ANALYSIS_AI_API_KEY: ${{ secrets.ANALYSIS_AI_API_KEY }}
          ANALYSIS_AI_MODEL: ${{ vars.ANALYSIS_AI_MODEL }}
      - name: Klargjør nøyaktig godkjent versjon
        if: github.event.review.state == 'approved'
        run: node scripts/analyser/cli.mjs stage
      - name: Installer for validering
        if: github.event.review.state == 'approved'
        working-directory: web
        run: npm ci
      - name: Test og bygg før publisering
        if: github.event.review.state == 'approved'
        working-directory: web
        run: |
          npm test
          npm run build
      - name: Kontroller godkjenningen igjen og flett
        if: github.event.review.state == 'approved'
        run: node scripts/analyser/cli.mjs publish
  deploy:
    needs: review
    if: github.event.review.state == 'approved'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: write

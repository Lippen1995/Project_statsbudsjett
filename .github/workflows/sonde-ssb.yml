name: Sonde – SSB KPI/BNP-tabeller

# Midlertidig diagnose: KPI (08981/03013) og BNP (09189) feiler med HTTP 400 på
# v0 og 503 på v2-beta, mens befolkning (07459) lykkes i samme kjøring. Denne
# workflowen skriver ut hva SSB faktisk svarer, slik at nedlasteren kan rettes
# mot virkeligheten framfor gjetning. Leser bare metadata – skriver ingenting.

on:
  workflow_dispatch:

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: v0-metadata per tabell (07459 er kontrollen som virker)
        run: |
          for t in 07459 08981 03013 09189; do
            echo "=================== v0 tabell $t ==================="
            code=$(curl -s -o /tmp/v0.txt -w '%{http_code}' \
              -H 'User-Agent: statsbudsjett-visualisering/1.0 (open source)' \
              "https://data.ssb.no/api/v0/no/table/$t")
            echo "HTTP $code"
            head -c 600 /tmp/v0.txt; echo
          done

      - name: v2 uten -beta (PxWebApi 2.0 kan ha gått ut av beta)
        run: |
          for t in 03013 09189; do
            echo "=================== v2 tabell $t ==================="
            for path in "v2-beta" "v2"; do
              code=$(curl -s -o /tmp/v2.txt -w '%{http_code}' \
                -H 'User-Agent: statsbudsjett-visualisering/1.0 (open source)' \
                "https://data.ssb.no/api/pxwebapi/$path/tables/$t/metadata?lang=no&outputFormat=json-stat2")
              echo "--- $path -> HTTP $code"
              head -c 300 /tmp/v2.txt; echo
            done
          done

      - name: Finn gjeldende tabell-ID-er for KPI og BNP
        run: |
          for q in konsumprisindeks bruttonasjonalprodukt; do
            echo "=================== søk: $q ==================="
            curl -s -H 'User-Agent: statsbudsjett-visualisering/1.0 (open source)' \
              "https://data.ssb.no/api/pxwebapi/v2/tables?query=$q&lang=no&pageSize=15" \
              -o /tmp/sok.json
            python3 -c "
          import json
          d = json.load(open('/tmp/sok.json'))
          rader = d.get('tables', d if isinstance(d, list) else [])
          for t in rader[:15]:
              print(' ', t.get('id'), '|', (t.get('label') or '')[:80],
                    '| oppdatert', t.get('updated', '')[:10],
                    '| avsluttet' if t.get('discontinued') else '')
          " || head -c 400 /tmp/sok.json
          done

      - name: Er v0-APIet i det hele fall i live?
        run: |
          echo "--- v0 tabell-liste (første 300 tegn) ---"
          curl -s -H 'User-Agent: statsbudsjett-visualisering/1.0 (open source)' \
            "https://data.ssb.no/api/v0/no/table/?query=konsumprisindeks" | head -c 300; echo

name: Admin – kontroller tilgang og arbeidsflyt
on:
  pull_request:
    paths:
      - 'server/admin/**'
      - 'scripts/admin/**'
      - 'scripts/analyser/**'
      - 'scripts/deploy/**'
      - 'web/**'
      - 'package*.json'
      - '.github/workflows/admin-check.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Installer låste avhengigheter
        run: |
          npm ci
          npm --prefix web ci
      - name: Kontroller ekte PostgreSQL-flyter og eksisterende analyser
        run: |
          npm test
          npm --prefix web test
          npm --prefix web run build

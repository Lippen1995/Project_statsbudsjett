name: Admin – kontroller tilgang og arbeidsflyt
on:
  pull_request:
    paths:
      - 'server/admin/**'
      - 'server/sven/**'
      - 'server/customer/**'
      - 'scripts/customer/**'
      - 'scripts/sven/**'
      - 'evaluation/sven/**'
      - 'scripts/admin/**'
      - 'scripts/analyser/**'
      - 'scripts/deploy/**'
      - 'web/**'
      - 'package*.json'
      - '.github/workflows/admin-check.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Installer låste avhengigheter
        run: |
          npm ci
          npm --prefix web ci
      - name: Kontroller ekte PostgreSQL-flyter og eksisterende analyser
        run: |
          npm test
          npm --prefix web test
          npm --prefix web run build
      - name: Installer Chromium for nettlesertester
        working-directory: web
        run: |
          npm install --prefix "$RUNNER_TEMP/fellestall-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/fellestall-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Kontroller åpning, mobil, refresh og tilgjengelighet
        working-directory: web
        run: PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/fellestall-browser/node_modules/playwright/index.mjs" npm run test:browser
      - name: Kontroller faktiske redaksjonelle artikler på mobil og desktop
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/fellestall-browser/node_modules/playwright/index.mjs
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'const m=await import(process.env.PLAYWRIGHT_MODULE_PATH); process.stdout.write(m.chromium.executablePath())')"
          npm run test:editorial:browser
      - name: Behold visuelle kontroller
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-intro-browser
          path: |
            web/browser-artifacts/
            editorial/runs/browser-verification/
          if-no-files-found: ignore

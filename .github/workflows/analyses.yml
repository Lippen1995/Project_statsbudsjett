name: Analyser – kontroller planlagt produksjon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kontroller oppsett uten å starte AI-produksjon
        run: node scripts/analyser/config.mjs
        env:
          ANALYSIS_REVIEWER: ${{ vars.ANALYSIS_REVIEWER }}

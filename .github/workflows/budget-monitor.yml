name: Budsjett – kontroller DFØ-vedtak mot arkiverte forslag
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: write
concurrency:
  group: budget-data-import
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r etl/requirements.txt
      - name: Kontroller bare budsjettene som venter på vedtak
        run: python etl/budget_proposals.py --sync-dfo
      - name: Lagre vedtatte tall og behold forslagsarkivet
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f web/public/data/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'budget: oppdater DFØ-tall og bevar forslag for sammenligning'
            git pull --rebase origin main
            git push origin main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
      pull-requests: write

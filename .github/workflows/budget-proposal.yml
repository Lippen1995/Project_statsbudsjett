name: Budsjett – importer regjeringens Gul bok-forslag
on:
  workflow_dispatch:
    inputs:
      year:
        description: Budsjettår
        default: '2027'
        required: true
  schedule:
    # Norwegian release 7 October 2026 at 10:00 CEST. Retry through the day.
    - cron: '15,45 8-14 7 10 *'
permissions:
  contents: write
concurrency:
  group: budget-data-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Begrens særskilt budsjettdagsplan til 2026
        id: release
        run: |
          if [ '${{ github.event_name }}' != 'schedule' ] || [ "$(date -u +%Y)" = '2026' ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.release.outputs.active == 'true'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.release.outputs.active == 'true'
        with:
          python-version: '3.11'
      - run: pip install -r etl/requirements.txt
        if: steps.release.outputs.active == 'true'
      - name: Finn offisiell fil, valider og arkiver forslaget
        if: steps.release.outputs.active == 'true'
        env:
          BUDGET_YEAR: ${{ inputs.year }}
        run: |
          budget_year="${BUDGET_YEAR:-2027}"
          python etl/budget_proposals.py --year "$budget_year"
      - name: Lagre nytt forslag og synlige statistikkserier
        if: steps.release.outputs.active == 'true'
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f web/public/data/
          python scripts/commit-generated.py --message "budget: importer og arkiver offisielt Gul bok-forslag"
  deploy:
    needs: import
    if: needs.import.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
      pull-requests: write

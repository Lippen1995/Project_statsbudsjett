name: Budsjett – importer regjeringens Gul bok-forslag
on:
  workflow_dispatch:
    inputs:
      year:
        description: Budsjettår
        default: '2027'
        required: true
  push:
    branches: [main]
    paths:
      - 'editorial/research/budsjett-2027/import-evidence/**'
      - 'etl/budget_sources.py'
      - '.github/workflows/budget-proposal.yml'
permissions:
  contents: write
concurrency:
  group: budget-data-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r etl/requirements.txt
      - name: Verifiser native originalkilder, finn filen og importer med samme validering
        env:
          BUDGET_YEAR: ${{ inputs.year }}
        run: |
          budget_year="${BUDGET_YEAR:-2027}"
          python etl/budget_sources.py --year "$budget_year"
      - name: Lagre nytt forslag og synlige statistikkserier
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f web/public/data/
          python scripts/commit-generated.py --message "budget: importer og arkiver offisielt Gul bok-forslag"
  deploy:
    needs: import
    if: needs.import.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
      pull-requests: write
